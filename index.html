<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>SNAKE</h1>
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Level</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">High Score</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <kbd>↑↓←→</kbd> or <kbd>WASD</kbd> • <kbd>Space</kbd> Pause • <kbd>M</kbd> Mute
        </div>
        <div class="mobile-controls">
            <div class="d-pad">
                <button class="d-btn up" data-dir="up">▲</button>
                <button class="d-btn left" data-dir="left">◀</button>
                <button class="d-btn right" data-dir="right">▶</button>
                <button class="d-btn down" data-dir="down">▼</button>
            </div>
        </div>
    </div>
    
    <div class="overlay" id="overlay">
        <div class="overlay-content">
            <h2 id="overlayTitle">Game Over</h2>
            <p id="overlayText">Score: 0</p>
            <button class="btn" id="restartBtn">Play Again</button>
        </div>
    </div>
  
    <script src="script.js"></script>
</body>
</html>
